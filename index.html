<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Thêm sách</title>
<link rel="stylesheet" href="style.css">
<script src="script.js"></script>
</head>
<body>

<h1 class="title">Thêm sách mới</h1>

<div class="container">
<form  action="AddBookServlet" method="post">

<label>Mã sách (Id sách):</label>
<input type="text" id="idsach" name="idsach" placeholder="Không được để trống" required>

<label>Tên sách:</label>
<input type="text" id="tensach" name="tensach" placeholder="Không được để trống" required>

<label>Tác giả:</label>
<input type="text" id="tacgia" name="tacgia" placeholder="Không được để trống" required>

<label>Giá:</label>
<input type="number" id="gia" name="gia" min="0" step="0.01" placeholder="Nhập giá (số)" required>

<label>Ưu tiên:</label>
<input type="number" id="uutien" name="uutien" min="1" max="2" placeholder="Chỉ được nhập 1 hoặc 2">

<button type="submit" onClick="kiemTra()">Thêm</button>
</form>
</div>

</body>
</html>
